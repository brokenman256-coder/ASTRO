[build]
  command = "npm install && npx prisma generate && npx prisma migrate deploy && npx tsx src/seed.ts"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/client/*.node"]
  external_node_modules = ["@prisma/client"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/scheduler-tick"
  to = "/.netlify/functions/scheduler-tick"
  status = 200
